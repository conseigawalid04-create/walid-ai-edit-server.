services:
  - type: web
    name: walid-ai-edit-server
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && apt-get update && apt-get install -y ffmpeg"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: API_KEY
        generateValue: true
        
